<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Aluguer de Carros | Alterar Palavra-passe</title>
  <link rel="stylesheet" href="css/font-awesome.min.css"><link rel="stylesheet" href="css/bootstrap.min.css"><link rel="stylesheet" href="css/dataTables.bootstrap.min.css"><link rel="stylesheet" href="css/bootstrap-social.css"><link rel="stylesheet" href="css/bootstrap-select.css"><link rel="stylesheet" href="css/fileinput.min.css"><link rel="stylesheet" href="css/awesome-bootstrap-checkbox.css"><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="admin-header"></div><div class="ts-main-content"><div id="admin-sidebar"></div><div class="content-wrapper"><div class="container-fluid"><div class="row"><div class="col-md-12">
    <h2 class="page-title">Alterar Palavra-passe</h2><div class="row"><div class="col-md-10"><div class="panel panel-default"><div class="panel-heading">Formulário de Palavra-passe</div><div class="panel-body">
      <div id="password-status" hidden></div><form method="post" id="password-form" class="form-horizontal">
        <div class="form-group"><label class="col-sm-4 control-label" for="current-password">Palavra-passe Atual</label><div class="col-sm-8"><input type="password" class="form-control" name="password" id="current-password" required></div></div><div class="hr-dashed"></div>
        <div class="form-group"><label class="col-sm-4 control-label" for="new-password">Nova Palavra-passe</label><div class="col-sm-8"><input type="password" class="form-control" name="newpassword" id="new-password" minlength="8" required></div></div><div class="hr-dashed"></div>
        <div class="form-group"><label class="col-sm-4 control-label" for="confirm-password">Confirmar Nova Palavra-passe</label><div class="col-sm-8"><input type="password" class="form-control" name="confirmpassword" id="confirm-password" minlength="8" required></div></div><div class="hr-dashed"></div>
        <div class="form-group"><div class="col-sm-8 col-sm-offset-4"><button class="btn btn-primary" type="submit">Guardar Palavra-passe</button></div></div>
      </form>
    </div></div></div></div>
  </div></div></div></div>
  <script src="js/jquery.min.js"></script><script src="js/bootstrap-select.min.js"></script><script src="js/bootstrap.min.js"></script><script src="js/admin-shell.js"></script><script src="js/change-password.js"></script>
</body></html>
